<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        .container {
            width: min(90%, 600px);
            text-align: center;
        }

        h1 {
            font-size: 80px;
            margin: 0;
        }

        h2 {
            font-size: 28px;
            margin: 10px 0;
        }

        p {
            color: #666;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 12px 22px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        a:hover {
            opacity: 0.85;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or may have been moved.</p>
        <a href="/">Return Home</a>
    </main>
</body>
  </html>
