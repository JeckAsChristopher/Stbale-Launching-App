<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stbale — Page Not Found</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg: #0c0e11;
            --panel: #13161b;
            --border: #242a31;
            --border-soft: #1b2026;
            --text: #f4f5f6;
            --muted: #939aa3;
            --muted-dim: #6b7279;
            --accent: #35c48d;
            --accent-dim: rgba(53, 196, 141, 0.14);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Inter', Arial, Helvetica, sans-serif;
            background:
                radial-gradient(ellipse 900px 500px at 50% -10%, var(--accent-dim), transparent 60%),
                var(--bg);
            color: var(--text);
        }

        .container {
            width: 100%;
            max-width: 520px;
            text-align: center;
            padding: 52px 38px 44px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--panel);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
        }

        .brand {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 40px;
        }

        .brand-mark {
            width: 9px;
            height: 9px;
            border-radius: 3px;
            background: var(--accent);
        }

        .brand h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.2px;
            color: var(--text);
        }

        .code {
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(56px, 12vw, 84px);
            font-weight: 700;
            line-height: 1;
            letter-spacing: -2px;
            color: var(--accent);
            margin-bottom: 10px;
        }

        h2 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        p.description {
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 32px;
        }

        a.home-link {
            display: inline-block;
            padding: 13px 26px;
            background: var(--accent);
            color: #14171c;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            border-radius: 9px;
            transition: opacity 0.15s ease;
        }

        a.home-link:hover {
            opacity: 0.85;
        }

        a.home-link:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 3px;
        }

        @media (max-width: 500px) {
            .container {
                padding: 40px 22px 34px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="brand">
            <span class="brand-mark"></span>
            <h1>Stbale</h1>
        </div>

        <div class="code">404</div>
        <h2>Page not found</h2>
        <p class="description">The page you're looking for doesn't exist or may have been moved.</p>
        <a class="home-link" href="/">Return home</a>
    </main>
</body>
</html>
